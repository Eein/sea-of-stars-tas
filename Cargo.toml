[package]
name = "sea-of-stars-tas"
version = "0.1.0"
edition = "2024"
# `cargo run` launches the GUI; use `cargo run --bin tas-cli` for the headless runner.
default-run = "sea-of-stars-tas"

[dependencies]
joystick = { path = "crates/joystick", version = "0.1.0" }
memory = { path = "crates/memory", version = "0.1.0" }
data = { path = "crates/data", version = "0.1.0" }
utility = { path = "crates/utility", version = "0.1.0" }
bytemuck = { version = "1.25.0", features = ["min_const_generics"] }
seq = { path = "crates/seq", version = "0.1.0" }
sysinfo = { version = "0.39.5", default-features = false, features = ["system", "multithread"] }
egui = { version = "0.34", features = ["persistence"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
clap = { version = "4.6.1", features = ["derive"] }
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    # Linux windowing backends. As of eframe 0.34 these also gate glutin's
    # x11/wayland GL support, so without them glutin fails to create a context
    # ("provided native window is not supported").
    "wayland",
    "x11",
] }
egui_dock = { version = "0.19.1", features = ["serde"] }
colog = "1.4.0"
log = "0.4.33"
# puffin is only used by the (currently commented-out) profiler. The official
# EmbarkStudios repo tracks egui 0.34; pinned to a commit for reproducibility.
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", rev = "7e08a533f9debfb7d051547263d2ab84c666314f" }
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "7e08a533f9debfb7d051547263d2ab84c666314f" }
yaml-rust2 = "0.11.0"
vec3-rs = "0.4.1"
libm = "0.2.16"
toml = "1.1.2"
toml_edit = "0.25.12"
itoa = "1.0.18"
delta = "0.2.1"
itertools = "0.15.0"
fps_clock = "2.0.0"
ron = "0.12.2"
vec2 = "0.2.1"
egui_extras = { version = "0.34", features = ["image"] }
image = { version = "0.25.10", features = ["png"] }

[dependencies.winit]
version = "=0.30.13"
features = ["default"]

[workspace]
members = [
  "crates/data",
  "crates/joystick",
  "crates/memory",
  "crates/utility"
]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true
